name: Check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tutorial-assets:
    name: Tutorial asset validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Show Ruby version
        run: ruby --version
      - name: Validate tutorial archive
        run: make check
